{% extends "base.html" %}
{% block title %}เริ่มคาบ{% endblock %}
{% block scripts %}<script defer src="/static/js/start.js"></script>{% endblock %}
{% block heading %}เริ่มคาบ{% endblock %}
{% block content %}
<div class="notice" id="my-open" hidden>
  <div>
    <div class="notice-title" id="my-open-title"></div>
    <div class="muted small" id="my-open-meta"></div>
  </div>
  <a class="btn btn-primary btn-sm" id="my-open-link" href="/live">กลับเข้าห้องเรียน</a>
</div>

<section id="rooms-step">
  <h2 class="step-title"><span class="step-no">1</span>เลือกห้อง</h2>
  <div class="room-grid" id="rooms"></div>
  <div class="card empty-card" id="rooms-empty" hidden>
    <h2 id="rooms-empty-title"></h2>
    <p class="muted" id="rooms-empty-text"></p>
  </div>
</section>

<section id="sections-step" hidden>
  <div class="step-row">
    <h2 class="step-title"><span class="step-no">2</span>เลือกเซ็คในห้อง <span id="room-label"></span></h2>
    <button type="button" class="btn btn-secondary btn-sm" id="change-room">เปลี่ยนห้อง</button>
  </div>
  <div class="card">
    <ul class="section-list" id="sections"></ul>
    <div class="empty" id="sections-empty" hidden>ห้องนี้ยังไม่มีเซ็คที่คุณสอน</div>
  </div>
  <p class="hint" id="room-busy" hidden></p>
</section>
{% endblock %}
